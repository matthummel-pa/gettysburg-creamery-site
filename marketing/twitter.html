<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pintfield Twitter / X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Shrikhand&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:1200px;height:675px;overflow:hidden;background:#2a160f;}
  .frame{
    width:1200px;height:675px;background:#fff8ee;border:10px solid #2a160f;
    display:grid;grid-template-columns:1.08fr .92fr;position:relative;overflow:hidden;
  }
  .spr{position:absolute;width:18px;height:7px;border-radius:6px;}
  .a{background:#ff3d7f;top:32px;left:548px;transform:rotate(22deg);}
  .b{background:#19c98a;top:56px;left:580px;transform:rotate(-18deg);}
  .c{background:#ffe14a;bottom:40px;left:40px;transform:rotate(40deg);}
  .copy{padding:52px 32px 44px 52px;display:flex;flex-direction:column;justify-content:center;}
  .kicker{
    font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.18em;
    text-transform:uppercase;color:#ff3d7f;font-weight:700;margin-bottom:14px;
  }
  h1{
    font-family:'Shrikhand',cursive;font-weight:400;font-size:64px;line-height:.95;
    color:#2a160f;max-width:9ch;
  }
  h1 em{font-style:normal;color:#ff3d7f;}
  p{margin-top:16px;font-family:'Outfit',sans-serif;font-size:22px;font-weight:600;color:#4a2c1f;max-width:22ch;line-height:1.3;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .chip{
    font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;
    border:3px solid #2a160f;border-radius:999px;padding:6px 12px;
  }
  .chip.pink{background:#ff3d7f;color:#fff;}
  .chip.mint{background:#19c98a;}
  .chip.lemon{background:#ffe14a;}
  .url{
    margin-top:24px;align-self:flex-start;
    font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;
    background:#2a160f;color:#ffe14a;padding:12px 18px;border-radius:999px;
  }
  .art{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff3fb,#fff8ee);}
  .stack{position:relative;width:280px;height:460px;}
  .scoop{
    width:210px;height:148px;margin:0 auto -30px;
    border-radius:50% 50% 46% 46%;border:6px solid #2a160f;
    background-size:cover;position:relative;
  }
  .s1{background-image:url("../images/scoop-hero-pink.jpg");background-position:50% 8%;z-index:3;}
  .s2{background-image:url("../images/scoop-hero-teal.jpg");background-position:50% 42%;transform:translateX(22px);z-index:2;}
  .s3{background-image:url("../images/scoop-hero-yellow.jpg");background-position:48% 38%;transform:translateX(-12px);z-index:1;}
  .cone{
    width:0;height:0;margin:0 auto;
    border-left:90px solid transparent;border-right:90px solid transparent;
    border-top:170px solid #e8a45a;filter:drop-shadow(0 8px 0 #2a160f);
  }
</style>
</head>
<body>
  <div class="frame">
    <i class="spr a"></i><i class="spr b"></i><i class="spr c"></i>
    <div class="copy">
      <div class="kicker">Gettysburg · Adams County</div>
      <h1>32 scoops. <em>Churned this morning.</em></h1>
      <p>A creamery site the owner updates — no developer required.</p>
      <div class="chips">
        <span class="chip pink">Live case</span>
        <span class="chip mint">Scoop Board</span>
        <span class="chip lemon">Menu + cart</span>
      </div>
      <div class="url">pintfield-creamery.netlify.app</div>
    </div>
    <div class="art">
      <div class="stack">
        <div class="scoop s1"></div>
        <div class="scoop s2"></div>
        <div class="scoop s3"></div>
        <div class="cone"></div>
      </div>
    </div>
  </div>
</body>
</html>
